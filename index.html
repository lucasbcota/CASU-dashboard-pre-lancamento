<style>
:root{
  --wine:#3D1F22; --wine-2:#5A2E33; --wine-soft:#EFE3E1; --cream:#F6F1EC; --paper:#FFFDFB;
  --ink:#1E1517; --muted:#8C7A7C; --line:#E8DDD8; --ok:#2E7D5B; --ok-soft:#E3F0EA; --bad:#B23B3B; --bad-soft:#F6E3E3;
  --gold:#C9A46B; --warn:#B88A2C; --warn-soft:#F5EBD6;
  --sans:"Gotham","Montserrat",system-ui,sans-serif; --serif:"Cormorant Garamond",Georgia,serif;
  --r:14px; --shadow:0 1px 2px rgba(61,31,34,.05),0 8px 24px -12px rgba(61,31,34,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--wine)}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:36px 32px;width:min(380px,100%);box-shadow:var(--shadow);position:relative;overflow:hidden}
.login-card:before{content:"";position:absolute;top:-70px;right:-70px;width:140px;height:140px;border-radius:50%;background:var(--wine-soft)}
.brand{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.12em;color:var(--wine)}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:2px;font-weight:500}
.field{margin-top:14px}
.field label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--wine);box-shadow:0 0 0 3px var(--wine-soft)}
.btn{border:1px solid var(--wine);background:var(--wine);color:#fff;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:500;letter-spacing:.02em;transition:.15s}
.btn:hover{background:var(--wine-2)}
.btn.ghost{background:transparent;color:var(--wine)}
.btn.ghost:hover{background:var(--wine-soft)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.err{color:var(--bad);font-size:12px;margin-top:10px;min-height:16px}

/* ---------- shell ---------- */
#app{display:none;min-height:100vh}
header.top{position:sticky;top:0;z-index:20;background:rgba(246,241,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:18px;padding:12px 28px 0;flex-wrap:wrap}
.top-row .brand{font-size:24px}
.top-row .brand small{font-size:9px;margin-top:0}
.tabs{display:flex;gap:2px;margin-left:8px;flex:1;overflow-x:auto}
.tab{position:relative;background:none;border:0;padding:12px 14px 16px;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap;letter-spacing:.02em}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--wine)}
.tab.active:after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:18px;height:9px;border-radius:9px 9px 0 0;background:var(--wine)}
.tab .badge{margin-left:6px;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:1px 7px;font-size:10px;font-weight:600}
.top-right{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(46,125,91,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,125,91,.45)}70%{box-shadow:0 0 0 7px rgba(46,125,91,0)}100%{box-shadow:0 0 0 0 rgba(46,125,91,0)}}

/* ---------- filter bar ---------- */
.filters{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;flex-wrap:wrap;border-top:1px solid var(--line)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:12px}
.seg button.on{background:var(--wine);color:#fff}
.filters input[type=date]{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;font-size:12px}
.filters .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-left:6px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--wine)}
.period-note{margin-left:auto;font-size:12px;color:var(--muted)}
.period-note b{color:var(--ink);font-weight:500}

/* ---------- layout ---------- */
main{padding:22px 28px 60px;max-width:1440px;margin:0 auto}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi:before{content:"";position:absolute;top:-18px;left:18px;width:36px;height:36px;border-radius:50%;background:var(--wine-soft);opacity:.7}
.kpi .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;position:relative}
.kpi .v{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.05;margin-top:8px;color:var(--wine);letter-spacing:-.01em}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:500;margin-left:2px}
.kpi .d{margin-top:8px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;border-radius:99px;padding:2px 8px;font-weight:600;font-size:11px}
.delta.up{background:var(--ok-soft);color:var(--ok)} .delta.down{background:var(--bad-soft);color:var(--bad)} .delta.flat{background:#EEE8E4;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--wine);letter-spacing:.01em}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chart-wrap{position:relative;height:280px}
.chart-wrap.tall{height:340px}.chart-wrap.short{height:220px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.section-title{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--wine);margin:28px 0 12px;display:flex;align-items:baseline;gap:12px}
.section-title span{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #F1EAE6;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow:auto;max-height:520px}
.chip{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;letter-spacing:.02em}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.no{background:#EEE8E4;color:var(--muted)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.wine{background:var(--wine-soft);color:var(--wine)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--serif);font-size:22px;color:var(--wine);font-weight:600;margin-bottom:6px}
.empty code{background:#F1EAE6;padding:2px 6px;border-radius:5px;font-size:11px}
.insights{display:grid;gap:8px}
.ins{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#FBF8F5;border:1px solid var(--line)}
.ins i{flex:0 0 8px;width:8px;height:8px;border-radius:50%;margin-top:5px}
.ins.good i{background:var(--ok)}.ins.bad i{background:var(--bad)}.ins.warn i{background:var(--warn)}.ins.info i{background:var(--gold)}
.ins b{font-weight:600}
.trend{font-size:11px;font-weight:600}.trend.up{color:var(--ok)}.trend.down{color:var(--bad)}.trend.flat{color:var(--muted)}
.loading{opacity:.55;pointer-events:none;filter:saturate(.6)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--muted)}
.pill.on{background:var(--wine);border-color:var(--wine);color:#fff}
.note{font-size:11px;color:var(--muted);margin-top:8px}
.bar-list{display:grid;gap:7px}
.bar-list .row{display:grid;grid-template-columns:130px 1fr 70px;align-items:center;gap:10px;font-size:12px}
.bar-list .bar{height:8px;background:#F1EAE6;border-radius:99px;overflow:hidden}
.bar-list .bar i{display:block;height:100%;background:var(--wine);border-radius:99px}
.bar-list .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ---------- cronograma ---------- */
.next-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.next{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--wine)}
.next.late{border-left-color:var(--bad)}.next.soon{border-left-color:var(--warn)}
.next .when{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.next .t{font-weight:600;margin:4px 0 6px}
.next .m{font-size:11px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0;font-weight:500}
.cal .day{min-height:88px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:11px}
.cal .day.out{opacity:.4}.cal .day.today{border-color:var(--wine);box-shadow:0 0 0 2px var(--wine-soft)}
.cal .day.mark{background:#FBF5F4}
.cal .dn{font-weight:600;color:var(--muted);margin-bottom:4px}
.cal .ev{display:block;border-radius:6px;padding:2px 6px;margin-top:3px;background:var(--wine-soft);color:var(--wine);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:500}
.cal .ev.pub{background:var(--ok-soft);color:var(--ok)}.cal .ev.pen{background:var(--warn-soft);color:var(--warn)}.cal .ev.mar{background:#EFE9F5;color:#5A3E7A}.cal .ev.wa{background:#E3F2EA;color:#1E6B45}
.status-sel{border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:11px;background:#fff;cursor:pointer}
.status-sel.pendente{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.status-sel.entregue{background:var(--wine-soft);color:var(--wine);border-color:transparent}
.status-sel.programado{background:#E4ECF7;color:#2C5C9E;border-color:transparent}
.status-sel.publicado{background:var(--ok-soft);color:var(--ok);border-color:transparent}
td .icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 5px;border-radius:6px}
td .icon-btn:hover{background:var(--wine-soft);color:var(--wine)}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(30,21,23,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:var(--r);width:min(560px,100%);padding:24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);max-height:92vh;overflow:auto}
.modal h3{margin:0 0 6px;font-family:var(--serif);font-size:24px;color:var(--wine);font-weight:600}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:9px 18px;font-size:12px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- projeções ---------- */
.proj-input{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.proj-input .field{margin-top:0}
.scen{display:flex;gap:8px}
.big-table td{font-size:13px}
.big-table td.num b{font-family:var(--serif);font-size:18px;color:var(--wine);font-weight:600}
.phase-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#F1EAE6;margin:8px 0}
.phase-bar i{display:block;height:100%}
@media (max-width:760px){.top-row,.filters,main{padding-left:14px;padding-right:14px}.kpi .v{font-size:26px}.chart-wrap{height:240px}.cal .day{min-height:60px}.modal .row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>
</head>

<div id="login">
  <div class="login-card">

    <div class="field"><label>E-mail</label><input id="lg-email" type="email" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="lg-pass" type="password" autocomplete="current-password"></div>

  </div>
</div>

<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">CASU<small>Board de operação</small></div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="vip">Lista VIP</button>
        <button class="tab" data-tab="meta">Meta Ads</button>
        <button class="tab" data-tab="ig">Instagram</button>
        <button class="tab" data-tab="proj">Projeções</button>
        <button class="tab" data-tab="cron">Cronograma <span class="badge" id="cron-badge"></span></button>

      <div class="seg" id="presets">
        <button data-p="7">7 dias</button><button data-p="14">14 dias</button><button data-p="30" class="on">30 dias</button><button data-p="90">90 dias</button><button data-p="all">Tudo</button>
      </div>

  <main>

</div>

<script>
/* =========================================================
   Núcleo: auth, estado, datas, agregação, gráficos
   ========================================================= */
const SB_URL='https://iiugiinllzsmjotmnvvl.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpdWdpaW5sbHpzbWpvdG1udnZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTA4MzAsImV4cCI6MjA5NDk2NjgzMH0._NbUMgydMneiN-OCyFF6qRRv9wbX1mTR5GWK0wTDlMI';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const CAMPAIGN_START='2026-08-20';

const S={ tab:'vip', preset:'30', from:null, to:null, gran:'auto', cmp:true,
  leads:[], cron:[], config:{}, meta:{}, ig:{}, gads:{}, metaStatus:null, charts:{} };

/* ---------- formatação ---------- */
const nf=new Intl.NumberFormat('pt-BR'), nf1=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}), nf2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=v=>'R$ '+nf2.format(v||0), num=v=>nf.format(Math.round(v||0)), pct=v=>nf1.format(v||0)+'%';
const fmtN=v=>Math.abs(v)>=10000?nf1.format(v/1000)+' mil':nf1.format(v||0);

/* ---------- datas ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/86400000)+1;
const dmy=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}`:'', dmyy=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(2,4)}`:'';
const normDate=s=>{ if(!s) return ''; s=String(s); if(/^\d{8}$/.test(s)) return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`; return s.slice(0,10); };
const MONTHS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function period(){ return {from:S.from,to:S.to}; }
function prevPeriod(){ const n=daysBetween(S.from,S.to); return {from:addDays(S.from,-n),to:addDays(S.from,-1)}; }
function granularity(){ if(S.gran!=='auto') return S.gran; const n=daysBetween(S.from,S.to); return n<=45?'day':n<=140?'week':'month'; }
function bucketKey(d,g){ if(g==='day') return d; if(g==='month') return d.slice(0,7); const dt=parse(d); const dow=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-dow); return iso(dt); }
function bucketLabel(k,g){ if(g==='day') return dmy(k); if(g==='month'){const [y,m]=k.split('-');return `${MONTHS[+m-1]}/${y.slice(2)}`;} return 'sem '+dmy(k); }
function buckets(from,to,g){ const out=[]; const seen=new Set(); let d=from; while(d<=to){const k=bucketKey(d,g); if(!seen.has(k)){seen.add(k);out.push(k);} d=addDays(d,1);} return out; }
function inRange(d,p){ return d>=p.from && d<=p.to; }

/* agrega linhas {date,...campos} por bucket, somando campos numéricos */
function aggregate(rows,p,g,fields){ const ks=buckets(p.from,p.to,g); const map=Object.fromEntries(ks.map(k=>[k,Object.fromEntries(fields.map(f=>[f,0]))]));
  rows.forEach(r=>{ if(!inRange(r.date,p)) return; const k=bucketKey(r.date,g); if(!map[k]) return; fields.forEach(f=>map[k][f]+=(+r[f]||0)); });
  return {keys:ks,labels:ks.map(k=>bucketLabel(k,g)),series:Object.fromEntries(fields.map(f=>[f,ks.map(k=>map[k][f])]))}; }
function sumField(rows,p,f){ return rows.reduce((a,r)=>a+(inRange(r.date,p)?(+r[f]||0):0),0); }
function delta(cur,prev){ if(!prev) return null; return (cur-prev)/prev*100; }
function deltaHTML(cur,prev,invert=false,suffix='vs anterior'){ if(!S.cmp) return ''; const d=delta(cur,prev); if(d===null||!isFinite(d)) return `<span class="delta flat">— ${suffix}</span>`;
  const good=invert? d<0 : d>0; const cls=Math.abs(d)<1?'flat':good?'up':'down'; const arrow=d>0?'▲':d<0?'▼':'•'; return `<span class="delta ${cls}">${arrow} ${nf1.format(Math.abs(d))}%</span><span>${suffix}</span>`; }
function trend(values){ // compara média da 2ª metade vs 1ª metade
  const v=values.filter(x=>x!==null&&x!==undefined); if(v.length<4) return {cls:'flat',txt:'poucos dados'}; const h=Math.floor(v.length/2); const a=v.slice(0,h).reduce((x,y)=>x+y,0)/h, b=v.slice(h).reduce((x,y)=>x+y,0)/(v.length-h);
  if(!a&&!b) return {cls:'flat',txt:'estável'}; const d=a?(b-a)/a*100:100; if(d>8) return {cls:'up',txt:`subindo ${nf1.format(d)}%`}; if(d<-8) return {cls:'down',txt:`caindo ${nf1.format(-d)}%`}; return {cls:'flat',txt:'estável'}; }
const movAvg=(arr,n=7)=>arr.map((_,i)=>{const s=arr.slice(Math.max(0,i-n+1),i+1);return s.reduce((a,b)=>a+b,0)/s.length});
const elapsedDays=p=>{const end=p.to<today()?p.to:today(); return end<p.from?0:daysBetween(p.from,end);};
const dailyAvg=(total,p)=>total/Math.max(1,elapsedDays(p));

/* ---------- gráficos ---------- */
Chart.defaults.font.family=getComputedStyle(document.documentElement).getPropertyValue('--sans');
Chart.defaults.color='#8C7A7C'; Chart.defaults.font.size=11;
const C={wine:'#3D1F22',wine2:'#5A2E33',gold:'#C9A46B',rose:'#C98A8A',ok:'#2E7D5B',muted:'#CDBFBA',blue:'#4C6FA5',violet:'#7A5A9E',sand:'#E3D3C0'};
const PALETTE=[C.wine,C.gold,C.rose,C.blue,C.violet,C.ok,C.sand,C.wine2];
function chart(id,cfg){ if(S.charts[id]) S.charts[id].destroy(); const el=document.getElementById(id); if(!el) return; S.charts[id]=new Chart(el,cfg); }
const gridOpt={grid:{color:'#F1EAE6'},border:{display:false}};
function lineBar(id,labels,datasets,{type='bar',stacked=false,money=false,prevLabels=null}={}){
  chart(id,{type,data:{labels,datasets:datasets.map((d,i)=>({borderRadius:6,borderWidth:type==='line'?2:0,tension:.35,pointRadius:labels.length>40?0:3,fill:false,backgroundColor:d.color||PALETTE[i],borderColor:d.color||PALETTE[i],...d}))},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:datasets.length>1,position:'bottom',labels:{boxWidth:10,usePointStyle:true}},tooltip:{callbacks:{label:c=>` ${c.dataset.label||''}: ${money?brl(c.raw):nf1.format(c.raw)}`}}},
      scales:{x:{...gridOpt,stacked,grid:{display:false},ticks:{maxTicksLimit:14}},y:{...gridOpt,stacked,beginAtZero:true,ticks:{callback:v=>money?brl(v):fmtN(v)}}}}}); }
function donut(id,labels,values){ chart(id,{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:PALETTE,borderWidth:2,borderColor:'#FFFDFB'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'right',labels:{boxWidth:10,usePointStyle:true}}}}}); }
function barList(el,items,fmt=num){ const max=Math.max(...items.map(i=>i.v),1); el.innerHTML=items.length?items.map(i=>`<div class="row"><span title="${i.k}">${i.k}</span><div class="bar"><i style="width:${i.v/max*100}%"></i></div><span class="num">${fmt(i.v)}</span></div>`).join(''):'<div class="note">Sem dados no período.</div>'; }
function kpi(l,v,sub='',extra=''){ return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${sub}${extra}</div></div>`; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- API proxy ---------- */
async function api(q,p){ const {data:{session}}=await sb.auth.getSession(); const u=`/api/windsor?q=${q}${p?`&from=${p.from}&to=${p.to}`:''}`;
  const r=await fetch(u,{headers:{Authorization:'Bearer '+session.access_token}}); const j=await r.json(); if(!r.ok){ const e=new Error(j.error||'erro'); e.notConnected=!!j.notConnected; throw e; } return j; }

/* ---------- filtros globais ---------- */
function setPreset(p){ S.preset=p; const t=today(); if(p==='all'){S.from=CAMPAIGN_START;S.to=t;} else {S.to=t;S.from=addDays(t,-(+p-1));} syncFilterUI(); refresh(); }
function syncFilterUI(){ $('#f-from').value=S.from; $('#f-to').value=S.to; $$('#presets button').forEach(b=>b.classList.toggle('on',b.dataset.p===S.preset)); $$('#gran button').forEach(b=>b.classList.toggle('on',b.dataset.g===S.gran));
  const g=granularity(), pv=prevPeriod(); $('#period-note').innerHTML=`<b>${dmyy(S.from)} – ${dmyy(S.to)}</b> · ${daysBetween(S.from,S.to)} dias · por ${({day:'dia',week:'semana',month:'mês'})[g]}${S.cmp?` · comparando com ${dmyy(pv.from)} – ${dmyy(pv.to)}`:''}`; }
$('#presets').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setPreset(b.dataset.p);});

$('#f-from').addEventListener('change',e=>{S.from=e.target.value;S.preset='';syncFilterUI();refresh();});

async function boot(){ $('#login').style.display='none'; $('#app').style.display='block';
  const [l,c,cfg,ig]=await Promise.all([sb.from('leads').select('*').order('created_at',{ascending:false}), sb.from('cronograma').select('*').order('data'), sb.from('config').select('*'), sb.from('instagram_diario').select('*').order('data')]);
  S.leads=(l.data||[]).map(normLead); S.cron=c.data||[]; S.config=Object.fromEntries((cfg.data||[]).map(r=>[r.chave,r.valor])); S.igLog=ig.data||[];
  sb.channel('board').on('postgres_changes',{event:'*',schema:'public',table:'leads'},p=>{ if(p.eventType==='INSERT') S.leads.unshift(normLead(p.new)); else if(p.eventType==='UPDATE') S.leads=S.leads.map(x=>x.id===p.new.id?normLead(p.new):x); else S.leads=S.leads.filter(x=>x.id!==p.old.id); if(S.tab==='vip') renderVIP(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'instagram_diario'},async()=>{ const {data}=await sb.from('instagram_diario').select('*').order('data'); S.igLog=data||[]; if(S.tab==='ig') renderIG(); if(S.tab==='proj') renderProj(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'cronograma'},p=>{ if(p.eventType==='INSERT'){ if(!S.cron.find(x=>x.id===p.new.id)) S.cron.push(p.new);} else if(p.eventType==='UPDATE') S.cron=S.cron.map(x=>x.id===p.new.id?p.new:x); else S.cron=S.cron.filter(x=>x.id!==p.old.id); S.cron.sort((a,b)=>(a.data+(a.hora||'')).localeCompare(b.data+(b.hora||''))); updateCronBadge(); if(S.tab==='cron') renderCron(); }).subscribe();
  updateCronBadge(); setPreset('30'); }
function normLead(r){ const d=new Date(r.created_at); return {...r,date:iso(d)}; }

const originOf=l=>{ if(!l.utm_source) return l.referrer?'Referência: '+(()=>{try{return new URL(l.referrer).hostname}catch{return l.referrer}})():'Direto'; if(l.utm_content) return `${l.utm_source} · ${l.utm_content}`; return `${l.utm_source}${l.utm_medium?' · '+l.utm_medium:''}`; };

    ${kpi('Total acumulado',`${num(all)}${meta?`<small>/ ${num(meta)}</small>`:''}`,`<span>${num(allGrp)} no grupo · ${all?pct(allGrp/all*100):'—'}</span>`)}

const GLABEL={day:'dia',week:'semana',month:'mês'};
const METAUI={metric:'spend'};
const METRICS={spend:['Investimento',true],impressions:['Impressões'],reach:['Alcance'],link_clicks:['Cliques no link'],landing_page_views:['Page views da LP'],follows:['Seguidores'],cadastros:['Cadastros VIP (pago)'],post_engagement:['Engajamento']};
function findFollowKey(fields){ return (fields||[]).find(f=>/follow/i.test(f)); }
function normMeta(j){ const fk=(j.fields||[]).includes('follows')?'follows':findFollowKey(j.fields); return j.data.map(r=>({...r,date:normDate(r.date),follows:fk?(+r[fk]||0):0})); }

async function loadMeta(){ const pv=prevPeriod(); const from=S.cmp?pv.from:S.from; const key=`${from}|${S.to}`; if(S.meta.key===key) return;
  const st=await api('status'); S.metaStatus=st; if(!st.meta){ S.meta={key,notConnected:true}; return; }
  const range={from,to:S.to}, cur=period();
  const [daily,ag,rg,dv,ads]=await Promise.all([api('meta_daily',range),api('meta_age_gender',cur),api('meta_region',cur),api('meta_device',cur),api('meta_ads',cur)]);
  S.meta={key,daily:normMeta(daily),age:normMeta(ag),region:normMeta(rg),device:normMeta(dv),ads:normMeta(ads),dropped:daily.dropped,mapping:daily.mapping||{},followKey:findFollowKey(daily.fields)};
  S.meta.ga4=null; if(st.ga4_lp){ try{ const n=j=>j.data.map(r=>({...r,date:normDate(r.date)})); const [d,src,geo,dev]=await Promise.all([api('ga4_lp_daily',range),api('ga4_lp_source',cur),api('ga4_lp_geo',cur),api('ga4_lp_device',cur)]); S.meta.ga4={daily:n(d),source:n(src),geo:n(geo),device:n(dev),dropped:d.dropped}; }catch(e){ S.meta.ga4={error:e.message}; } } }

function metaTotals(rows,p,leadsPaid){ const f=['spend','impressions','reach','link_clicks','clicks','landing_page_views','follows','post_engagement','post_reactions','comment','post_shares','post_saves','video_views','video_p25_watched_actions','video_p50_watched_actions','video_p75_watched_actions','video_p100_watched_actions','video_thruplay_watched_actions','leads'];
  const t=Object.fromEntries(f.map(k=>[k,sumField(rows,p,k)])); t.cadastros=leadsPaid.filter(l=>inRange(l.date,p)).length;
  t.ctr=t.impressions?t.link_clicks/t.impressions*100:0; t.cpc=t.link_clicks?t.spend/t.link_clicks:0; t.cpm=t.impressions?t.spend/t.impressions*1000:0; t.freq=t.reach?t.impressions/t.reach:0;
  t.lpconv=t.landing_page_views?t.cadastros/t.landing_page_views*100:0; t.cpl=t.cadastros?t.spend/t.cadastros:0; t.cpf=t.follows?t.spend/t.follows:0; t.engRate=t.impressions?t.post_engagement/t.impressions*100:0; t.spendDay=dailyAvg(t.spend,p); return t; }

function metaInsights(t,pt,followsDaily,campaigns){ const out=[]; const add=(cls,h)=>out.push(`<div class="ins ${cls}"><i></i><div>${h}</div></div>`);
  if(!t.spend) { add('info','<b>Sem investimento no período.</b> Os insights aparecem assim que houver entrega.'); return out.join(''); }
  const d=(a,b)=>b?(a-b)/b*100:null;
  const dCpm=d(t.cpm,pt.cpm), dCtr=d(t.ctr,pt.ctr), dFreq=d(t.freq,pt.freq), dCpf=d(t.cpf,pt.cpf), dConv=d(t.lpconv,pt.lpconv), dSpend=d(t.spend,pt.spend);
  if(S.cmp&&pt.spend){
    if(dCpm!==null&&dCpm>15&&dCtr!==null&&dCtr<-10) add('bad',`<b>Sinal de saturação de criativo:</b> CPM subiu ${nf1.format(dCpm)}% e CTR caiu ${nf1.format(-dCtr)}% vs período anterior. Vale rodar criativo novo ou ampliar público.`);
    else if(dCtr!==null&&dCtr>10) add('good',`<b>CTR melhorou ${nf1.format(dCtr)}%</b> em relação ao período anterior — os criativos atuais estão conversando melhor com o público.`);
    if(t.freq>3) add('warn',`<b>Frequência em ${nf1.format(t.freq)}.</b> Acima de 3 a mesma pessoa já viu o anúncio muitas vezes; o custo tende a subir daqui em diante.`);
    if(dCpf!==null&&t.follows&&pt.follows){ if(dCpf<-10) add('good',`<b>Custo por seguidor caiu ${nf1.format(-dCpf)}%</b> (${brl(t.cpf)} agora vs ${brl(pt.cpf)}).`); else if(dCpf>15) add('warn',`<b>Custo por seguidor subiu ${nf1.format(dCpf)}%</b> (${brl(t.cpf)} vs ${brl(pt.cpf)}). Com ${dSpend>0?'mais':'menos'} verba, o retorno por real diminuiu.`); }
    if(dConv!==null&&dConv<-15&&t.landing_page_views>50) add('warn',`<b>Conversão da LP caiu ${nf1.format(-dConv)}%</b> (${pct(t.lpconv)}). O tráfego está chegando, mas cadastra menos — checar se o público mudou ou se a promessa do anúncio bate com a página.`);
    if(dConv!==null&&dConv>15&&t.cadastros>5) add('good',`<b>Conversão da LP subiu ${nf1.format(dConv)}%</b> — ${pct(t.lpconv)} de quem vê a página se cadastra.`);
  } else { if(t.freq>3) add('warn',`<b>Frequência em ${nf1.format(t.freq)}</b> — atenção à saturação.`); }
  if(t.link_clicks&&t.landing_page_views){ const drop=100-t.landing_page_views/t.link_clicks*100; if(drop>35) add('warn',`<b>${nf1.format(drop)}% dos cliques não carregam a LP.</b> Perda alta entre clique e page view: pode ser velocidade da página no celular ou cliques acidentais.`); }
  if(t.lpconv>0){ add(t.lpconv>=25?'good':t.lpconv>=12?'info':'warn',`<b>Conversão da LP: ${pct(t.lpconv)}</b> (${num(t.cadastros)} cadastros / ${num(t.landing_page_views)} page views). Referência para lista VIP de moda: 15–30%.`); }
  if(t.cadastros) add('info',`<b>Custo por cadastro VIP: ${brl(t.cpl)}</b> · custo por seguidor: ${t.follows?brl(t.cpf):'—'} · investimento médio de ${brl(t.spendDay)}/dia.`);
  const ft=trend(followsDaily); if(t.follows) add(ft.cls==='up'?'good':ft.cls==='down'?'warn':'info',`<b>Seguidores do pago: média de ${nf1.format(t.follows/Math.max(1,elapsedDays(period())))}/dia</b>, ritmo ${ft.txt}.`);
  if(t.impressions&&t.video_views){ const p100=t.video_p100_watched_actions/t.video_views*100; add(p100>=15?'good':p100>=7?'info':'warn',`<b>${pct(p100)} de quem começa o vídeo assiste até o fim</b> (${pct(t.video_p25_watched_actions/t.video_views*100)} passam de 25%). ${p100<7?'Os primeiros 3 segundos seguram, mas o meio perde — testar vídeos mais curtos.':''}`); }
  if(campaigns.length>1){ const best=[...campaigns].filter(c=>c.link_clicks>30).sort((a,b)=>a.cpc-b.cpc)[0], worst=[...campaigns].filter(c=>c.link_clicks>30).sort((a,b)=>b.cpc-a.cpc)[0]; if(best&&worst&&best!==worst&&worst.cpc>best.cpc*1.6) add('info',`<b>${esc(best.campaign)}</b> entrega clique a ${brl(best.cpc)}; <b>${esc(worst.campaign)}</b> a ${brl(worst.cpc)}. Vale realocar parte da verba.`); }
  return out.join(''); }

async function renderMeta(){ const el=$('#tab-meta'); el.classList.add('loading'); if(!el.innerHTML) el.innerHTML='<div class="empty">Carregando Meta Ads…</div>';
  try{ await loadMeta(); }catch(e){ el.classList.remove('loading'); el.innerHTML=`<div class="card"><div class="empty"><b>Não consegui falar com o Windsor</b>${esc(e.message)}<div class="note">Confira no Vercel as variáveis <code>WINDSOR_KEY</code> e <code>META_ACCOUNT</code>.</div></div></div>`; return; }
  el.classList.remove('loading');
  if(S.meta.notConnected){ el.innerHTML=`<div class="card"><div class="empty"><b>Meta Ads ainda não conectado</b>No Vercel, adicione a variável <code>META_ACCOUNT</code> com o ID da conta de anúncios da CASU (o mesmo que aparece em "select_accounts" no Windsor) e faça um novo deploy.</div></div>`; return; }
  const p=period(), pv=prevPeriod(), g=granularity(), rows=S.meta.daily, leadsPaid=S.leads.filter(isPaid);
  const t=metaTotals(rows,p,leadsPaid), pt=metaTotals(rows,pv,leadsPaid);
  const lp=leadsPaid.map(l=>({date:l.date,cadastros:1})); const allRows=rows.concat(lp);
  const fieldsAgg=['spend','impressions','reach','link_clicks','landing_page_views','follows','post_engagement','cadastros'];
  const cur=aggregate(allRows,p,g,fieldsAgg), prev=aggregate(allRows,pv,g,fieldsAgg);
  const fDaily=aggregate(rows,p,'day',['follows','spend']);
  const ftr=trend(fDaily.series.follows), favg=t.follows/Math.max(1,elapsedDays(p));
  // campanhas
  const cmap={}; rows.filter(r=>inRange(r.date,p)).forEach(r=>{const k=r.campaign||'—'; const c=cmap[k]=cmap[k]||{campaign:k,spend:0,impressions:0,reach:0,link_clicks:0,landing_page_views:0,follows:0,post_engagement:0,days:new Set()}; ['spend','impressions','reach','link_clicks','landing_page_views','follows','post_engagement'].forEach(f=>c[f]+=+r[f]||0); if(+r.spend>0) c.days.add(r.date);});
  const campaigns=Object.values(cmap).map(c=>({...c,ctr:c.impressions?c.link_clicks/c.impressions*100:0,cpc:c.link_clicks?c.spend/c.link_clicks:0,cpf:c.follows?c.spend/c.follows:0,spendDay:c.spend/Math.max(1,c.days.size)})).sort((a,b)=>b.spend-a.spend);

function parseKV(v){ // "São Paulo:120,Belo Horizonte:80" | {a:1} | [{...}]
  if(!v) return []; if(typeof v==='object'&&!Array.isArray(v)) return Object.entries(v).map(([k,x])=>({k,v:+x||0}));
  if(typeof v==='string'){ try{const j=JSON.parse(v); if(j&&typeof j==='object') return parseKV(j);}catch{} return v.split(',').map(s=>{const i=s.lastIndexOf(':');return i>0?{k:s.slice(0,i).trim(),v:+s.slice(i+1)||0}:null}).filter(Boolean); } return []; }
async function apiIG(q,p){ const {data:{session}}=await sb.auth.getSession(); const r=await fetch(`/api/instagram?q=${q}${p?`&from=${p.from}&to=${p.to}`:''}`,{headers:{Authorization:'Bearer '+session.access_token}}); const j=await r.json(); if(!r.ok){ const e=new Error(j.error||'erro'); e.notConnected=!!j.notConnected; throw e; } return j; }
async function loadIG(){ const pv=prevPeriod(); const from=S.cmp?pv.from:S.from; const key=`${from}|${S.to}`; if(S.ig.key===key) return;
  if(S.igGraph===undefined){ try{ S.igGraph=(await apiIG('status')).configured; }catch{ S.igGraph=false; } }
  if(S.igGraph){ // Graph API direta (Meta for Developers)
    const [d,a,m]=await Promise.all([apiIG('daily',{from,to:S.to}),apiIG('audience').catch(()=>({data:[]})),apiIG('media',period()).catch(()=>({data:[]}))]);
    S.ig={key,source:'graph',daily:d.data,audience:a.data,media:m.data,dropped:d.dropped,followersTotal:d.followers_total};
    // guarda o total de hoje no registro diário (vira histórico permanente)
    if(d.followers_total){ const t=today(); const cur=(S.igLog||[]).find(x=>x.data===t); if(!cur||cur.seguidores!==d.followers_total){ const r=d.data.find(x=>x.date===t)||{}; sb.from('instagram_diario').upsert({data:t,seguidores:d.followers_total,alcance:r.reach??null,impressoes:r.impressions??null,visitas_perfil:r.profile_views??null,cliques_site:r.website_clicks??null,interacoes:r.total_interactions??null,obs:'automático (API)'}).then(()=>{}); } }
    return; }
  const st=S.metaStatus||await api('status'); S.metaStatus=st; if(!st.ig){ S.ig={key,notConnected:true}; return; }
  const [d,a,m]=await Promise.all([api('ig_daily',{from,to:S.to}),api('ig_audience',period()).catch(()=>({data:[]})),api('ig_media',period()).catch(()=>({data:[]}))]);
  S.ig={key,source:'windsor',daily:d.data.map(r=>({...r,date:normDate(r.date)})),audience:a.data,media:m.data.map(r=>({...r,date:normDate(r.date)})),dropped:d.dropped}; }
/* Registro manual (instagram_diario): série diária de seguidores totais, interpolada entre lançamentos */
function igSeries(from,to){ const log=[...(S.igLog||[])].sort((a,b)=>a.data.localeCompare(b.data)); if(!log.length) return []; const out=[]; let d=from; const first=log[0], last=log[log.length-1];
  while(d<=to){ let v=null; if(d<first.data) v=null; else if(d>=last.data) v=last.seguidores; else { const i=log.findIndex(x=>x.data>d); const a=log[i-1], b=log[i]; const n=daysBetween(a.data,b.data)-1, k=daysBetween(a.data,d)-1; v=Math.round(a.seguidores+(b.seguidores-a.seguidores)*k/n); }
    out.push({date:d,total:v}); d=addDays(d,1); } return out.map((r,i,arr)=>({...r,novos:i>0&&r.total!==null&&arr[i-1].total!==null?r.total-arr[i-1].total:0})); }
function igOrganicPerDay(p){ const s=igSeries(addDays(p.from,-1),p.to).filter(r=>r.date>=p.from); const tot=s.reduce((a,r)=>a+r.novos,0); const paid=S.metaAll?sumField(S.metaAll,p,'follows'):0; return {total:tot,paid,organic:Math.max(0,tot-paid),perDay:Math.max(0,tot-paid)/Math.max(1,elapsedDays(p))}; }

async function renderIG(){ const el=$('#tab-ig'); el.classList.add('loading'); if(!el.innerHTML) el.innerHTML='<div class="empty">Carregando Instagram…</div>';
  try{ await loadIG(); }catch(e){ el.classList.remove('loading'); el.innerHTML=`<div class="card"><div class="empty"><b>Não consegui falar com o Windsor</b>${esc(e.message)}</div></div>`; return; }
  el.classList.remove('loading');
  if(S.ig.notConnected){ return renderIGManual(el); }
  const p=period(), pv=prevPeriod(), g=granularity(), rows=S.ig.daily;
  const f=['follower_count','reach','impressions','profile_views','website_clicks']; const T=Object.fromEntries(f.map(k=>[k,sumField(rows,p,k)])), PT=Object.fromEntries(f.map(k=>[k,sumField(rows,pv,k)]));
  const last=[...rows].filter(r=>inRange(r.date,p)&&+r.followers>0).sort((a,b)=>b.date.localeCompare(a.date))[0]; const total=S.ig.followersTotal||(last?+last.followers:0);

  $('#proj-gads').onchange=e=>{PROJ.gadsCpl=+e.target.value||4;renderProj();};
  $('#proj-save').onclick=async()=>{ const nf=fases.map(f=>({...f})); $$('#tab-proj .proj-input input[data-f]').forEach(i=>{nf[+i.dataset.f][i.dataset.k]=i.dataset.k==='fim'?i.value:+i.value;}); const metas={...(S.config.metas||{}),leads_vip:+$('#proj-meta').value||0};
    const {error}=await sb.from('config').upsert([{chave:'fases',valor:nf},{chave:'metas',valor:metas}]); if(error) return toast('Erro ao salvar: '+error.message); S.config.fases=nf; S.config.metas=metas; toast('Premissas salvas'); renderProj(); };
}

/* =========================================================
   ABA 5 · Cronograma de conteúdo
   ========================================================= */
const CRON={fase:'all',canal:'all',status:'all',view:'lista',month:null};
const CANAL={instagram:'Instagram',marcela:'Marcela',whatsapp:'WhatsApp VIP',ads:'Anúncio'};
const FORMATO={reels:'Reels',post:'Post',carrossel:'Carrossel',stories:'Stories',card:'Card',collab:'Collab'};
const STATUS=['pendente','entregue','programado','publicado'];
const isLate=i=>i.data<today()&&i.status!=='publicado';
function updateCronBadge(){ const n=S.cron.filter(i=>isLate(i)||(i.status==='pendente'&&daysBetween(today(),i.data)<=7&&i.data>=today())).length; $('#cron-badge').textContent=n||''; $('#cron-badge').style.display=n?'':'none'; }
function renderCron(){ const el=$('#tab-cron'); const t=today();
  const upcoming=S.cron.filter(i=>i.status!=='publicado'&&i.data>=t).slice(0,4), late=S.cron.filter(isLate);
  let list=S.cron.filter(i=>(CRON.fase==='all'||i.fase===CRON.fase)&&(CRON.canal==='all'||i.canal===CRON.canal)&&(CRON.status==='all'||i.status===CRON.status));
  const counts=Object.fromEntries(STATUS.map(s=>[s,S.cron.filter(i=>i.status===s).length]));
  el.innerHTML=`
  <div class="next-strip">
    ${late.length?`<div class="next late"><div class="when">Atrasado</div><div class="t">${late.length} item(ns) passaram da data sem publicar</div><div class="m">${late.slice(0,3).map(i=>`${dmy(i.data)} · ${esc(i.titulo)}`).join('<br>')}</div></div>`:''}
    ${upcoming.map(i=>{const d=daysBetween(t,i.data)-1; return `<div class="next ${d<=2?'soon':''}"><div class="when">${d===0?'Hoje':d===1?'Amanhã':`Em ${d} dias`} · ${dmy(i.data)}${i.hora?' '+i.hora:''}</div><div class="t">${esc(i.titulo)}</div><div class="m">${CANAL[i.canal]||i.canal} · ${FORMATO[i.formato]||i.formato} · ${esc(i.responsavel||'')} · <span class="status-sel ${i.status}" style="padding:1px 7px">${i.status}</span>${i.link_drive?` · <a href="${esc(i.link_drive)}" target="_blank">Drive</a>`:' · <span style="color:var(--warn)">sem arquivo</span>'}</div></div>`}).join('')||'<div class="next"><div class="t">Nada pendente à frente.</div></div>'}
  </div>
  <div class="card" style="margin-top:14px">
    <div class="card-head"><div><h3>Cronograma</h3><div class="sub">${num(S.cron.length)} peças · ${counts.publicado} publicadas · ${counts.programado} programadas · ${counts.entregue} entregues · ${counts.pendente} pendentes</div></div>
      <div class="tools">
        <div class="seg" id="cron-view"><button data-v="lista" class="${CRON.view==='lista'?'on':''}">Lista</button><button data-v="cal" class="${CRON.view==='cal'?'on':''}">Calendário</button></div>
        <select id="cron-fase"><option value="all">Todas as fases</option><option value="pre">Pré-lançamento</option><option value="lancamento">Lançamento</option><option value="pos">Pós</option></select>
        <select id="cron-canal"><option value="all">Todos os canais</option>${Object.entries(CANAL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
        <select id="cron-status"><option value="all">Todos os status</option>${STATUS.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
        <button class="btn sm" id="cron-add">+ Nova peça</button></div></div>
    <div id="cron-body"></div></div>`;
  $('#cron-fase').value=CRON.fase; $('#cron-canal').value=CRON.canal; $('#cron-status').value=CRON.status;
  $('#cron-view').onclick=e=>{const b=e.target.closest('button');if(b){CRON.view=b.dataset.v;renderCron();}};
  ['fase','canal','status'].forEach(k=>$('#cron-'+k).onchange=e=>{CRON[k]=e.target.value;renderCron();});
  $('#cron-add').onclick=()=>openCronModal();
  const body=$('#cron-body');
  if(CRON.view==='lista'){
    body.innerHTML=`<div class="table-wrap" style="max-height:none"><table><thead><tr><th>Data</th><th>Canal</th><th>Formato</th><th>Peça</th><th>Resp.</th><th>Arquivo</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(i=>`<tr style="${isLate(i)?'background:#FCF3F3':''}"><td style="white-space:nowrap">${dmyy(i.data)}${i.hora?`<br><span class="note" style="margin:0">${i.hora}</span>`:''}${i.impulsionar?'<br><span class="chip wine" style="margin-top:3px">impulsionar</span>':''}</td><td>${CANAL[i.canal]||i.canal}</td><td>${FORMATO[i.formato]||i.formato}</td><td><b>${esc(i.titulo)}</b>${i.descricao?`<br><span class="note" style="margin:2px 0 0">${esc(i.descricao)}</span>`:''}</td><td>${esc(i.responsavel||'')}</td><td>${i.link_drive?`<a href="${esc(i.link_drive)}" target="_blank">abrir no Drive</a>`:'<span class="chip warn">pendente</span>'}</td><td><select class="status-sel ${i.status}" data-id="${i.id}">${STATUS.map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select></td><td style="white-space:nowrap"><button class="icon-btn" data-edit="${i.id}" title="Editar">✎</button><button class="icon-btn" data-del="${i.id}" title="Excluir">✕</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhuma peça com esse filtro.</td></tr>'}
    </tbody></table></div>`;
    body.querySelectorAll('.status-sel').forEach(s=>s.onchange=async e=>{const id=+e.target.dataset.id; const {error}=await sb.from('cronograma').update({status:e.target.value}).eq('id',id); if(error) toast('Erro: '+error.message); else { S.cron=S.cron.map(x=>x.id===id?{...x,status:e.target.value}:x); toast('Status atualizado'); updateCronBadge(); renderCron(); } });
    body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openCronModal(S.cron.find(x=>x.id===+b.dataset.edit)));
    body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ const it=S.cron.find(x=>x.id===+b.dataset.del); if(!confirm(`Excluir "${it.titulo}"?`)) return; const {error}=await sb.from('cronograma').delete().eq('id',it.id); if(error) toast('Erro: '+error.message); else { S.cron=S.cron.filter(x=>x.id!==it.id); toast('Excluída'); updateCronBadge(); renderCron(); } });
  } else {
    if(!CRON.month) CRON.month=t.slice(0,7); const [y,m]=CRON.month.split('-').map(Number); const first=new Date(y,m-1,1); const start=new Date(first); start.setDate(1-((first.getDay()+6)%7)); const cells=[]; for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(d);}
    const cls=i=>i.status==='publicado'?'pub':i.canal==='marcela'?'mar':i.canal==='whatsapp'?'wa':i.status==='pendente'?'pen':'';
    body.innerHTML=`<div class="tools" style="justify-content:space-between"><button class="btn ghost sm" id="cal-prev">‹ mês anterior</button><b style="font-family:var(--serif);font-size:20px;color:var(--wine)">${MONTHS[m-1]} ${y}</b><button class="btn ghost sm" id="cal-next">próximo mês ›</button></div>
      <div class="cal">${['seg','ter','qua','qui','sex','sáb','dom'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.map(d=>{const k=iso(d); const evs=list.filter(i=>i.data===k); return `<div class="day ${d.getMonth()!==m-1?'out':''} ${k===t?'today':''} ${evs.length?'mark':''}"><div class="dn">${d.getDate()}</div>${evs.map(i=>`<span class="ev ${cls(i)}" data-edit="${i.id}" title="${esc(i.titulo)}">${i.hora?i.hora+' ':''}${esc(i.titulo)}</span>`).join('')}</div>`}).join('')}</div>
      <div class="note">Cores: <span class="chip wine">SUMOS</span> <span class="chip" style="background:#EFE9F5;color:#5A3E7A">Marcela</span> <span class="chip" style="background:#E3F2EA;color:#1E6B45">WhatsApp</span> <span class="chip warn">pendente</span> <span class="chip ok">publicado</span> · clique numa peça para editar</div>`;
    $('#cal-prev').onclick=()=>{const d=new Date(y,m-2,1);CRON.month=iso(d).slice(0,7);renderCron();}; $('#cal-next').onclick=()=>{const d=new Date(y,m,1);CRON.month=iso(d).slice(0,7);renderCron();};
    body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openCronModal(S.cron.find(x=>x.id===+b.dataset.edit)));
  }
}
function openCronModal(item){ const it=item||{data:today(),hora:'19:30',canal:'instagram',formato:'post',titulo:'',descricao:'',responsavel:'SUMOS',link_drive:'',status:'pendente',impulsionar:false,fase:today()<'2026-10-06'?'pre':'lancamento'};
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal"><h3>${item?'Editar peça':'Nova peça'}</h3>
    <div class="field"><label>Peça</label><input id="m-titulo" value="${esc(it.titulo)}" placeholder="Ex.: Reels Provador CASU"></div>
    <div class="row2"><div class="field"><label>Data</label><input id="m-data" type="date" value="${it.data}"></div><div class="field"><label>Hora</label><input id="m-hora" value="${esc(it.hora||'')}" placeholder="19:30"></div></div>
    <div class="row2"><div class="field"><label>Canal</label><select id="m-canal">${Object.entries(CANAL).map(([k,v])=>`<option value="${k}" ${k===it.canal?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Formato</label><select id="m-formato">${Object.entries(FORMATO).map(([k,v])=>`<option value="${k}" ${k===it.formato?'selected':''}>${v}</option>`).join('')}</select></div></div>
    <div class="row2"><div class="field"><label>Responsável</label><input id="m-resp" value="${esc(it.responsavel||'')}"></div><div class="field"><label>Fase</label><select id="m-fase"><option value="pre" ${it.fase==='pre'?'selected':''}>Pré-lançamento</option><option value="lancamento" ${it.fase==='lancamento'?'selected':''}>Lançamento</option><option value="pos" ${it.fase==='pos'?'selected':''}>Pós</option></select></div></div>
    <div class="field"><label>Link do arquivo no Drive</label><input id="m-link" value="${esc(it.link_drive||'')}" placeholder="https://drive.google.com/…"></div>
    <div class="field"><label>Observações</label><textarea id="m-desc" rows="2">${esc(it.descricao||'')}</textarea></div>
    <div class="row2"><div class="field"><label>Status</label><select id="m-status">${STATUS.map(s=>`<option ${s===it.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field" style="display:flex;align-items:end"><label class="chk" style="margin-bottom:10px"><input type="checkbox" id="m-imp" ${it.impulsionar?'checked':''}> impulsionar com anúncio</label></div></div>
    <div class="actions"><button class="btn ghost" id="m-cancel">Cancelar</button><button class="btn" id="m-save">${item?'Salvar':'Adicionar'}</button></div></div>`;
  document.body.appendChild(bg); bg.querySelector('#m-titulo').focus();
  bg.querySelector('#m-cancel').onclick=()=>bg.remove(); bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});
  bg.querySelector('#m-save').onclick=async()=>{ const rec={titulo:bg.querySelector('#m-titulo').value.trim(),data:bg.querySelector('#m-data').value,hora:bg.querySelector('#m-hora').value.trim()||null,canal:bg.querySelector('#m-canal').value,formato:bg.querySelector('#m-formato').value,responsavel:bg.querySelector('#m-resp').value.trim(),fase:bg.querySelector('#m-fase').value,link_drive:bg.querySelector('#m-link').value.trim()||null,descricao:bg.querySelector('#m-desc').value.trim()||null,status:bg.querySelector('#m-status').value,impulsionar:bg.querySelector('#m-imp').checked};
    if(!rec.titulo||!rec.data) return toast('Peça e data são obrigatórias');
    if(rec.link_drive&&rec.status==='pendente') rec.status='entregue';
    const q=item?sb.from('cronograma').update(rec).eq('id',item.id).select().single():sb.from('cronograma').insert(rec).select().single(); const {data,error}=await q; if(error) return toast('Erro: '+error.message);
    if(item) S.cron=S.cron.map(x=>x.id===item.id?data:x); else if(!S.cron.find(x=>x.id===data.id)) S.cron.push(data); S.cron.sort((a,b)=>(a.data+(a.hora||'')).localeCompare(b.data+(b.hora||''))); bg.remove(); toast(item?'Peça atualizada':'Peça adicionada'); updateCronBadge(); renderCron(); };
}
</script>
